<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHRUG! - Login</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>

<body class="login-body">

<header class="top-bar">
  <div class="logo">SHRUG!</div>
</header>

<h1 class="hero-title">START HABITS,<br> RISE UP, GLOW!</h1>

<!-- Login form -->
<form id="login-form" class="login-box">
  <input type="email" id="login-email" placeholder="Email" required>
  <input type="password" id="login-password" placeholder="Password" required>
  <button type="button" id="login-btn" class="login-btn">Sign In</button>
  <p id="login-error" class="error"></p>
  <p class="signup-text">or <a href="#" id="show-signup">Sign Up</a></p>
</form>

<!-- Signup form -->
<form id="signup-form" class="login-box" style="display:none;">
  <input type="text" id="signup-name" placeholder="Your name" required>
  <input type="email" id="signup-email" placeholder="Email" required>
  <input type="password" id="signup-password" placeholder="Password (6+ chars)" required>
  <button type="button" id="signup-btn" class="login-btn">Create Account</button>
  <p id="signup-error" class="error"></p>
  <p class="signup-text">Already have an account? <a href="#" id="show-login">Sign In</a></p>
</form>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword,
    updateProfile 
  } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
  import { doc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const loginForm = document.getElementById('login-form');
  const signupForm = document.getElementById('signup-form');
  const loginBtn = document.getElementById('login-btn');
  const signupBtn = document.getElementById('signup-btn');
  const showSignup = document.getElementById('show-signup');
  const showLogin = document.getElementById('show-login');

  showSignup.addEventListener('click', (e) => {
    e.preventDefault();
    loginForm.style.display = 'none';
    signupForm.style.display = 'flex';
  });

  showLogin.addEventListener('click', (e) => {
    e.preventDefault();
    signupForm.style.display = 'none';
    loginForm.style.display = 'flex';
  });

  /*Login*/
  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const err = document.getElementById('login-error'); 
    err.textContent = '';

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'homepage.html';
    } catch (e) {
      err.textContent = e.message.replace('Firebase:', '');
    }
  });

  /*Signup*/
  signupBtn.addEventListener('click', async () => {
    const name = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const err = document.getElementById('signup-error'); 
    err.textContent = '';

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);

      await setDoc(doc(db, 'users', cred.user.uid), {
        profile: { name, email }
      });

      await updateProfile(cred.user, {
        displayName: name
      });

      window.location.href = 'homepage.html';

    } catch (e) {
      err.textContent = e.message.replace('Firebase:', '');
    }
  });
</script>

</body>
</html>
