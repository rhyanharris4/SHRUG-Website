<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHRUG! - Affirmations Hub</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="script.js"></script>
  <script src="affirmations.js" defer></script>
  <script type="module" src="logout.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar" class="sidebar" role="navigation" aria-hidden="true">
    <button class="close-btn" onclick="toggleSidebar()" aria-label="Close menu">✕</button>
    <a href="homepage.html" class="menu-link">HOMEPAGE</a>
    <a href="all-tasks.html" class="menu-link">MY TASKS</a>
    <a href="add-task.html" class="menu-link">ADD TASKS</a>
    <a href="affirmations.html" class="menu-link">AFFIRMATIONS HUB</a>
    <a href="#" id="logoutBtn" class="menu-link">LOG OUT</a>

  </div>

  <!-- Header -->
  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
      <h1 class="logo">Start Habits, Rise Up, Grow!</h1>
    </div>
    <a href="add-task.html" class="add-task-btn">＋ Add Task</a>
  </header>

  <h2 class="greeting">AFFIRMATION HUB</h2>

  <!-- Mood List Container -->
  <section class="affirmations-section">
      <div id="moodList" class="aff-mood-list">
      </div>

      <!-- Affirmations for selected mood -->
      <div id="affirmationList" class="aff-affirmation-list">
      </div>
  </section>

  <!-- Pop-up -->
  <div id="affirmationModal" class="modal">
      <div class="modal-content">
          <span class="modal-close" onclick="closePopup()">✕</span>
          <p id="modalText"></p>
      </div>
  </div>

</body>
</html>
